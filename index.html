<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofoliu Case</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a18; min-height: 100vh; }
  .header { padding: 10px 16px; border-bottom: 1px solid #e5e3da; background: #fff; display: flex; align-items: center; gap: 12px; }
  .sticky-top { position: sticky; top: 0; z-index: 10; }
  .header-icon { width: 36px; height: 36px; background: #E6F1FB; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header span { font-size: 13px; color: #73726c; }
  .search-bar { padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e3da; }
  .search-bar input { width: 100%; padding: 9px 14px; border: 1px solid #d3d1c7; border-radius: 10px; font-size: 15px; background: #f5f5f0; color: #1a1a18; outline: none; }
  .search-bar input:focus { border-color: #378ADD; background: #fff; }
  .filters { padding: 10px 16px; display: flex; gap: 8px; background: #fff; border-bottom: 1px solid #e5e3da; overflow-x: auto; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #d3d1c7; font-size: 13px; cursor: pointer; white-space: nowrap; background: #fff; color: #5f5e5a; }
  .filter-btn.active { background: #E6F1FB; color: #0C447C; border-color: #85B7EB; font-weight: 500; }
  .count { scroll-margin-top: 126px; font-size: 13px; color: #73726c; padding: 10px 16px 4px; }
  .list { padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border: 1px solid #e5e3da; border-radius: 14px; padding: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 8px; }
  .card-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .badge-new { background: #E6F1FB; color: #0C447C; }
  .badge-visited { background: #EAF3DE; color: #27500A; }
  .badge-contact { background: #FAEEDA; color: #633806; }
  .card-addr { font-size: 13px; color: #73726c; margin-bottom: 8px; line-height: 1.4; }
  .card-meta { display: flex; gap: 16px; font-size: 13px; color: #73726c; margin-bottom: 8px; flex-wrap: wrap; }
  .card-meta strong { color: #1a1a18; }
  .card-note { font-size: 13px; color: #5f5e5a; background: #f5f5f0; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.5; }
  .card-actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn-nav { flex: 1; padding: 9px 8px; border-radius: 10px; border: 1px solid #d3d1c7; font-size: 14px; font-weight: 500; cursor: pointer; background: #f5f5f0; color: #1a1a18; text-decoration: none; text-align: center; display: block; }
  .btn-gm { background: #E6F1FB; color: #0C447C; border-color: #85B7EB; }
  .btn-waze { background: #EAF3DE; color: #1E5C0E; border-color: #97C459; }
  .btn-copy { background: #f5f5f0; color: #5f5e5a; border-color: #d3d1c7; font-size: 13px; }
  .coords { font-size: 12px; color: #8a887f; cursor: pointer; display: inline-block; padding: 6px 0; -webkit-tap-highlight-color: transparent; text-decoration: underline dotted; text-underline-offset: 3px; }
  .coords.copiat { color: #27500A; font-weight: 600; text-decoration: none; }
  .no-results { text-align: center; padding: 40px 20px; color: #73726c; }
  .add-panel { scroll-margin-top: 122px; background: #fff; border-bottom: 1px solid #e5e3da; padding: 10px 16px; }
  .add-toggle { width: 100%; padding: 10px; border-radius: 10px; border: 1px dashed #85B7EB; background: #E6F1FB; color: #0C447C; font-size: 15px; font-weight: 600; cursor: pointer; }
  .add-form { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
  .add-form.open { display: flex; }
  .add-form label { font-size: 12px; font-weight: 600; color: #5f5e5a; display: block; margin-bottom: 4px; }
  .add-form input, .add-form textarea { width: 100%; padding: 9px 12px; border: 1px solid #d3d1c7; border-radius: 10px; font-size: 16px; font-family: inherit; background: #f5f5f0; color: #1a1a18; outline: none; }
  .add-form input:focus, .add-form textarea:focus { border-color: #378ADD; background: #fff; }
  .add-form textarea { min-height: 70px; resize: vertical; }
  .coord-row { display: flex; gap: 8px; }
  .coord-row > div { flex: 1; min-width: 0; }
  .form-hint { font-size: 12px; color: #73726c; }
  .btn-reload { margin-left: auto; flex-shrink: 0; padding: 8px 12px; border-radius: 10px; border: 1px solid #d3d1c7; background: #f5f5f0; color: #1a1a18; font-size: 14px; font-weight: 500; cursor: pointer; }
  .btn-reload:disabled { opacity: .6; cursor: default; }
  .link-row { display: flex; gap: 8px; }
  .link-row input { flex: 1; min-width: 0; }
  .btn-clear { flex: none; padding: 9px 12px; }
  .link-status { font-size: 12px; margin-top: 4px; min-height: 16px; color: #73726c; }
  .link-status.ok { color: #27500A; }
  .link-status.err { color: #A32D2D; }
  .link-status.warn { color: #854F0B; }
  .link-status a { color: #185FA5; font-weight: 600; }
  .card.stergere { opacity: .45; pointer-events: none; }
  .form-error { font-size: 13px; color: #A32D2D; display: none; }
  .form-actions { display: flex; gap: 8px; }
  .btn-save { background: #185FA5; color: #fff; border-color: #185FA5; }
  .card-edit { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .btn-edit { flex: none; font-size: 13px; padding: 7px 14px; }
  .edit-title { font-size: 14px; font-weight: 600; color: #0C447C; display: none; }
  .btn-del { padding: 7px 14px; flex: none; background: #FCEBEB; color: #A32D2D; border-color: #F09595; font-size: 13px; }
  .form-ok { font-size: 13px; color: #27500A; background: #EAF3DE; border-radius: 8px; padding: 8px 10px; margin-top: 10px; display: none; }
  .btn-save:disabled { opacity: .6; cursor: default; }
  .badge-manual { background: #E1F5EE; color: #085041; }
  .badge-direct { background: #E6F1FB; color: #0C447C; }
  .badge-modificat { background: #FAEEDA; color: #633806; }
  .badge-asteptare { background: #F1EFE8; color: #444441; }
  .badge-eroare { background: #FCEBEB; color: #A32D2D; }
  .card-cod { display: flex; align-items: baseline; gap: 10px; background: #EAF3DE; border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .card-cod .et { font-size: 12px; color: #3B6D11; flex: none; }
  .card-cod .val { font-size: 22px; font-weight: 600; letter-spacing: 1px; color: #173404; font-variant-numeric: tabular-nums; word-break: break-all; }
  .card-cod.copiat .val { font-size: 15px; letter-spacing: 0; }
  .pop-cod { font-size: 13px; margin-bottom: 4px; }
  .card-err { font-size: 12px; color: #A32D2D; margin-bottom: 8px; }
  .coada-bar { display: none; align-items: center; gap: 10px; font-size: 13px; color: #633806; background: #FAEEDA; border-radius: 8px; padding: 8px 10px; margin-top: 10px; }
  .coada-bar span { flex: 1; }
  .coada-bar button { flex: none; padding: 6px 10px; border-radius: 8px; border: 1px solid #EF9F27; background: #fff; color: #633806; font-size: 13px; font-weight: 600; cursor: pointer; }
  .count { display: flex; align-items: center; gap: 8px; }
  .count-text { flex: 1; min-width: 0; }
  .btn-harta { flex: none; padding: 6px 12px; border-radius: 20px; border: 1px solid #d3d1c7; background: #fff; color: #1a1a18; font-size: 13px; font-weight: 500; cursor: pointer; }
  .btn-harta.activ { background: #E6F1FB; color: #0C447C; border-color: #85B7EB; }
  #mapWrap { display: none; padding: 8px 16px 24px; position: relative; }
  #map { height: calc(100vh - 210px); min-height: 320px; border-radius: 14px; border: 1px solid #e5e3da; background: #e9e7df; z-index: 0; }
  #mapMsg { display: none; text-align: center; padding: 40px 20px; color: #73726c; }
  .btn-pozitie { position: absolute; right: 26px; bottom: 44px; z-index: 5; padding: 9px 12px; border-radius: 10px; border: 1px solid #d3d1c7; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  .pop-nume { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
  .pop-note { font-size: 12px; color: #5f5e5a; white-space: pre-wrap; margin-bottom: 6px; max-height: 90px; overflow: auto; }
  .pop-links a { font-weight: 600; margin-right: 10px; }
  .badge-local { background: #EEEDFE; color: #3C3489; }
</style>
</head>
<body>

<div class="sticky-top">
<div class="header">
  <div class="header-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z" fill="#185FA5"/>
    </svg>
  </div>
  <div>
    <h1>Portofoliu Case</h1>
    <span id="subtitle"></span>
  </div>
  <button type="button" class="btn-reload" id="btnReload" onclick="reincarcaPagina()">↻ Reîncarcă</button>
</div>

<div class="search-bar">
  <input type="search" placeholder="Caută după nume, cod sau notițe..." id="searchInput" oninput="filterCards(); laRezultate()">
</div>
</div>

<div class="add-panel">
  <button class="add-toggle" id="addToggle" onclick="toggleForm()">+ Adaugă casă</button>
  <form class="add-form" id="addForm" onsubmit="saveCasa(event)">
    <div class="edit-title" id="editTitle"></div>
    <div>
      <label for="fNume">Nume casă</label>
      <input type="text" id="fNume" placeholder="ex. Vila Marina" required>
    </div>
    <div>
      <label for="fLink">Link Google Maps / Hărți Apple (opțional)</label>
      <div class="link-row">
        <input type="text" id="fLink" placeholder="Lipește linkul locației" autocomplete="off" autocapitalize="off"
               onpaste="lipesteLink(event)" onchange="dinLink(false)" oninput="if (!this.value.trim()) ultimulLink = ''">
        <button type="button" class="btn-nav btn-copy btn-clear" onclick="reseteazaCoord()">Resetează</button>
      </div>
      <div class="link-status" id="linkStatus">Coordonatele se completează singure din link.</div>
    </div>
    <div class="coord-row">
      <div>
        <label for="fLat">Latitudine</label>
        <input type="text" id="fLat" inputmode="decimal" placeholder="42.5531" onpaste="pasteCoords(event)" required>
      </div>
      <div>
        <label for="fLng">Longitudine</label>
        <input type="text" id="fLng" inputmode="decimal" placeholder="8.7572" required>
      </div>
    </div>
    <div>
      <label for="fCod">Cod acces (opțional)</label>
      <input type="text" id="fCod" placeholder="ex. 2512" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
    <div>
      <label for="fNote">Notițe</label>
      <textarea id="fNote" placeholder="Cum ajungi, parcare, unde e cheia..."></textarea>
    </div>
    <div class="form-hint" id="modeHint"></div>
    <div class="form-error" id="formError"></div>
    <div class="form-actions">
      <button type="button" class="btn-nav btn-copy" id="btnLocatie" onclick="useMyLocation()">📍 Locația mea</button>
      <button type="submit" class="btn-nav btn-save" id="btnSave">Salvează</button>
    </div>
  </form>
  <div class="form-ok" id="formOk"></div>
  <div class="coada-bar" id="coadaBar"><span id="coadaText"></span><button type="button" id="coadaBtn" onclick="trimiteCoada(true)">Trimite acum</button></div>
</div>

<div class="count"><span class="count-text"><span id="countLabel"></span><span id="syncLabel"></span></span><button type="button" class="btn-harta" id="btnHarta" onclick="comutaHarta()">Hartă</button></div>
<div id="mapWrap">
  <div id="map"></div>
  <div id="mapMsg"></div>
  <button type="button" class="btn-pozitie" id="btnPozitie" onclick="pozitiaMea()">📍 Poziția mea</button>
</div>
<div class="list" id="cardList"></div>

<script>
/* ================================================
   EDITEAZĂ LISTA DE CASE MAI JOS
   ================================================
   Pentru fiecare casă, completează:
   - nume: numele sau ID-ul proprietății
   - adresa: adresa completă
   - lat / lng: coordonatele GPS (zecimale)
   - note: observații personale
   - status: "new" | "visited" | "contact"
   - suprafata: ex. "120mp"
   - pret: ex. "95.000€" (opțional, lasă "" dacă nu vrei)
   - tel: telefon proprietar (opțional, lasă "" dacă nu vrei)
   ================================================ */

let case_ = [];

/* ================================================
   LEGĂTURA CU GOOGLE SHEET
   Lipește între ghilimele adresa aplicației web Apps Script
   (se termină în /exec). Cât timp rămâne goală, casele noi
   se salvează doar pe dispozitivul curent.
   ================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylIOmKEu8GqeKfwAYU073vx1Z3AU5qw0GgzLB52vI3x33mtm0m1f5CigSyYO21DCdiYA/exec';

/* Copia listei păstrată pe telefon: se afișează imediat la deschidere,
   apoi se actualizează în fundal când răspunde rețeaua. */
const CACHE_KEY = 'coordonate-case-cache';
let cacheData = null;      // momentul ultimei actualizări reușite
let seIncarca = true;
let modificari = 0;        // crește la fiecare adăugare / ștergere
const inStergere = new Set();

function citesteCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && Array.isArray(c.case)) { case_ = c.case; cacheData = c.t; return true; }
  } catch (e) {}
  return false;
}

function scrieCache() {
  cacheData = Date.now();
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: cacheData, case: case_ })); } catch (e) {}
}

function setSync(text) { document.getElementById('syncLabel').textContent = text ? ' · ' + text : ''; }

function dataScurta(t) {
  const d = new Date(t), azi = new Date();
  const ora = d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === azi.toDateString() ? 'azi ' + ora : d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' }) + ' ' + ora;
}

function cuLimita(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

/* Lista se cere scriptului împreună cu codul PIN; fără el, foaia nu răspunde */
async function dinScript() {
  const d = await apel({ action: 'list' });
  return d.case;
}

let pinCerut = false;      // lista e protejată și codul nu a fost introdus

function stergeCache() {
  case_ = [];
  cacheData = null;
  try { localStorage.removeItem(CACHE_KEY); } catch (e) {}
}

async function incarca() {
  const areCache = citesteCache();
  if (areCache) filterCards();
  if (!SCRIPT_URL) { seIncarca = false; filterCards(); return; }
  setSync('se actualizează…');
  const v = modificari;
  try {
    const lista = await dinScript();
    pinCerut = false;
    pinAnulat = false;
    /* Dacă între timp s-a adăugat sau șters ceva, răspunsul acesta e deja vechi:
       nu-l folosim, ca să nu readucă în listă o casă ștearsă. */
    if (v !== modificari) { setSync(''); seIncarca = false; filterCards(); return; }
    case_ = lista;
    scrieCache();
    setSync('actualizat acum');
  } catch (e) {
    if (e.anulat) { pinCerut = true; setSync('lista este protejată cu PIN'); }
    else if (e.retea) setSync(cacheData ? 'fără conexiune, date de ' + dataScurta(cacheData) : 'fără conexiune');
    else setSync(e.code === 'Actiune necunoscuta.' ? 'scriptul din Google Sheet trebuie actualizat' : 'lista nu a putut fi citită');
  }
  seIncarca = false;
  filterCards();
  trimiteCoada();
}

/* ================================================ */

/* ================================================
   CASE ADĂUGATE DIN FORMULAR
   Se salvează în browser (localStorage), pe acest dispozitiv.
   ================================================ */

const STORAGE_KEY = 'coordonate-case-local';
let caseLocale = loadLocale();

function loadLocale() {
  try {
    const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

function saveLocale() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(caseLocale)); return true; }
  catch (e) { return false; }
}

/* ================================================
   COADA DE MODIFICĂRI
   Adăugările și editările se pun întâi aici, pe telefon, și apar imediat în listă.
   De aici pleacă spre Google Sheet; dacă nu e semnal, rămân în așteptare
   și se trimit singure când revine conexiunea.
   ================================================ */

const COADA_KEY = 'coordonate-case-coada';
let coada = loadCoada();
let seTrimite = false;     // o trimitere este în curs
let opInZbor = null;       // modificarea aflată chiar acum pe drum
let pinAnulat = false;     // utilizatorul a închis fereastra de PIN

function loadCoada() {
  try {
    const v = JSON.parse(localStorage.getItem(COADA_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

function saveCoada() {
  try { localStorage.setItem(COADA_KEY, JSON.stringify(coada)); return true; }
  catch (e) { return false; }
}

function acelasiNume(a, b) { return String(a == null ? '' : a).trim() === String(b == null ? '' : b).trim(); }

/* Lista afișată = lista din Google Sheet + modificările care încă așteaptă */
function toateCasele() {
  const editari = coada.filter(o => o.tip === 'update');
  const lista = case_.map(c => {
    const o = editari.find(o => String(o.id) === String(c.id) && acelasiNume(o.numeVechi, c.nume));
    return o ? Object.assign({}, c, { nume: o.nume, lat: o.lat, lng: o.lng, note: o.note, cod: o.cod, _op: o, _srv: c })
             : Object.assign({}, c, { _srv: c });
  });
  coada.filter(o => o.tip === 'add').forEach(o => {
    lista.push({ id: o.k, nume: o.nume, lat: o.lat, lng: o.lng, note: o.note, cod: o.cod, app: true, _op: o });
  });
  return caseLocale.concat(lista);
}

function actualizeazaBara() {
  const bara = document.getElementById('coadaBar');
  const erori = coada.filter(o => o.eroare).length;
  const rest = coada.length - erori;
  if (!coada.length) { bara.style.display = 'none'; return; }
  const m = n => n + (n === 1 ? ' modificare' : ' modificări');
  let text;
  if (seTrimite) text = 'Se trimit ' + m(rest || coada.length) + ' în Google Sheet…';
  else if (rest) text = m(rest) + (rest === 1 ? ' așteaptă' : ' așteaptă') + ' semnal ca să ajungă în Google Sheet.';
  else text = m(erori) + (erori === 1 ? ' nu a putut fi trimisă' : ' nu au putut fi trimise') + '. Vezi cardul marcat „Netrimis”.';
  document.getElementById('coadaText').textContent = text;
  document.getElementById('coadaBtn').style.display = (!seTrimite && rest) ? '' : 'none';
  bara.style.display = 'flex';
}

async function trimiteCoada(manual) {
  if (!SCRIPT_URL || seTrimite) return;
  if (manual) pinAnulat = false;
  if (pinAnulat) return;
  seTrimite = true;
  actualizeazaBara();
  try {
    for (;;) {
      const op = coada.find(o => !o.eroare);
      if (!op) break;
      opInZbor = op;
      modificari++;
      filterCards();
      const date = { nume: op.nume, lat: op.lat, lng: op.lng, note: op.note, cod: op.cod || '' };
      let r;
      try {
        r = await apel(Object.assign(op.tip === 'add' ? { action: 'add' } : { action: 'update', id: op.id, numeVechi: op.numeVechi }, date));
      } catch (e) {
        opInZbor = null;
        if (e.retea) {
          showOk('„' + op.nume + '” e salvată pe telefon și se trimite singură când revine semnalul.');
          break;
        }
        if (e.anulat) { pinAnulat = true; break; }
        if (op.tip === 'update' && e.code === 'notfound') {
          coada = coada.filter(o => o !== op);
          saveCoada();
          showOk('Modificarea pentru „' + op.nume + '” nu a putut fi aplicată: casa nu mai există în Google Sheet sau a fost redenumită de pe alt dispozitiv.');
          continue;
        }
        op.eroare = e.code === 'Actiune necunoscuta.' ? 'Scriptul din Google Sheet trebuie actualizat.' : e.message;
        saveCoada();
        continue;
      }
      modificari++;
      if (op.tip === 'add') {
        case_.push(r.casa);
      } else {
        const srv = case_.find(c => String(c.id) === String(op.id) && acelasiNume(c.nume, op.numeVechi));
        if (srv) {
          Object.assign(srv, date);
          srv.modificat = r.modificat !== undefined ? !!r.modificat : true;
        }
      }
      coada = coada.filter(o => o !== op);
      opInZbor = null;
      saveCoada();
      scrieCache();
      showOk('✓ „' + op.nume + '” a ajuns în Google Sheet.');
    }
  } finally {
    seTrimite = false;
    opInZbor = null;
    actualizeazaBara();
    filterCards();
  }
}

/* Renunță la o modificare care nu a fost încă trimisă */

  const op = coada.find(o => o.k === k);
  if (!op) return;
  if (op === opInZbor) { showOk('Modificarea se trimite chiar acum și nu mai poate fi oprită.'); return; }
  if (!confirm(op.tip === 'add' ? 'Renunți la „' + op.nume + '”? Nu a fost încă trimisă în Google Sheet.' : 'Renunți la modificarea pentru „' + op.nume + '”? Casa rămâne cum era.')) return;
  coada = coada.filter(o => o !== op);
  saveCoada();
  actualizeazaBara();
  filterCards();
}

}

function getPin() { try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; } }
function setPin(v) { try { localStorage.setItem(PIN_KEY, v); } catch (e) {} }

/* Trimite o modificare către Google Sheet */
async function apel(data, pinGresit) {
  data.pin = getPin();
  let d;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data),
      signal: ctrl.signal
    });
    d = await res.json();
  } catch (e) {
    const er = new Error('Nu am putut contacta Google Sheet. Verifică conexiunea la internet.');
    er.retea = true;
    throw er;
  } finally {
    clearTimeout(timer);
  }
  if (d.error === 'pin') {
    /* Codul lipsește sau a fost schimbat: telefonul nu mai are voie să arate lista păstrată */
    stergeCache();
    filterCards();
    const p = prompt(pinGresit ? 'Cod greșit. Încearcă din nou:' : 'Introdu codul PIN al aplicației:');
    if (p === null) { const er = new Error('Operațiune anulată.'); er.anulat = true; throw er; }
    setPin(p.trim());
    return apel(data, true);
  }
  if (!d.ok) {
    const er = new Error(d.mesaj || d.error || 'Eroare necunoscută.');
    er.code = d.error;
    throw er;
  }
  return d;
}

/* ================================================
   COORDONATE DIN LINK (Google Maps / Hărți Apple)
   ================================================ */

function coordValide(lat, lng) {
  lat = Number(lat); lng = Number(lng);
  return isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && !(lat === 0 && lng === 0);
}

/* Întoarce { lat, lng, aprox } sau null */
function coordDinText(text) {
  let t = String(text || '');
  for (let i = 0; i < 2; i++) { try { t = decodeURIComponent(t); } catch (e) { break; } }
  const N = '(-?\\d{1,3}(?:\\.\\d+)?)';
  const tipare = [
    [new RegExp('!3d' + N + '!4d' + N), false],                                             // Google: pinul locului
    [new RegExp('[?&#](?:q|query|ll|coordinate|destination|daddr|center|address)=(?:loc:)?' + N + '\\s*,\\s*' + N, 'i'), false],
    [new RegExp('/maps/(?:search|place|dir)/' + N + ',\\+?' + N), false],
    [new RegExp('@' + N + ',' + N), true],                                                  // Google: centrul hărții
    [new RegExp('[?&#]sll=' + N + ',' + N, 'i'), true]
  ];
  for (const [re, aprox] of tipare) {
    const m = t.match(re);
    if (m && coordValide(m[1], m[2])) return { lat: Number(m[1]), lng: Number(m[2]), aprox: aprox };
  }
  if (!/https?:\/\//i.test(t)) {
    const m = t.match(new RegExp(N + '\\s*[,;\\s]\\s*' + N));
    if (m && coordValide(m[1], m[2])) return { lat: Number(m[1]), lng: Number(m[2]), aprox: false };
  }
  return null;
}

/* Linkurile de tip „loc” nu conțin coordonate, ci identificatorul locului (0x...:0x...).
   Din el se poate calcula poziția cu o precizie de câteva zeci de metri. */
function coordDinFtid(hex) {
  let h = String(hex || '').replace(/^0x/i, '').toLowerCase();
  if (!/^[0-9a-f]{1,16}$/.test(h)) return null;
  while (h.length < 16) h = '0' + h;
  let biti = '';
  for (let c = 0; c < 16; c++) biti += ('000' + parseInt(h.charAt(c), 16).toString(2)).slice(-4);
  const fata = parseInt(biti.slice(0, 3), 2);
  const ultim = biti.lastIndexOf('1');
  if (fata > 5 || ultim < 0) return null;
  const nivel = 30 - ((63 - ultim) >> 1);
  if (nivel < 20) return null;                       // celula prea mare ca sa fie utila
  const POS_IJ = [[0, 1, 3, 2], [0, 2, 3, 1], [3, 2, 0, 1], [3, 1, 0, 2]];
  const POS_OR = [1, 0, 0, 3];
  let i = 0, j = 0, orient = fata & 1;
  for (let k = 0; k < nivel; k++) {
    const pos = parseInt(biti.substr(3 + 2 * k, 2), 2);
    const ij = POS_IJ[orient][pos];
    i = i * 2 + (ij >> 1); j = j * 2 + (ij & 1);
    orient ^= POS_OR[pos];
  }
  const n = Math.pow(2, nivel);
  const uv = function (x) { return x >= 0.5 ? (4 * x * x - 1) / 3 : (1 - 4 * (1 - x) * (1 - x)) / 3; };
  const u = uv((i + 0.5) / n), v = uv((j + 0.5) / n);
  const p = [[1, u, v], [-u, 1, v], [-u, -v, 1], [-1, -v, -u], [v, -1, -u], [v, u, -1]][fata];
  const lat = Math.atan2(p[2], Math.sqrt(p[0] * p[0] + p[1] * p[1])) * 180 / Math.PI;
  const lng = Math.atan2(p[1], p[0]) * 180 / Math.PI;
  return { lat: Math.round(lat * 1e6) / 1e6, lng: Math.round(lng * 1e6) / 1e6, aprox: true };
}

function ftidDinText(text) {
  let t = String(text || '');
  for (let k = 0; k < 2; k++) { try { t = decodeURIComponent(t); } catch (e) { break; } }
  const m = t.match(/(?:ftid=|!1s)(0x[0-9a-f]{8,16}):0x[0-9a-f]+/i);
  return m ? coordDinFtid(m[1]) : null;
}

function linkStatus(msg, tip, coord) {
  const e = document.getElementById('linkStatus');
  e.textContent = msg;
  e.className = 'link-status' + (tip ? ' ' + tip : '');
  if (coord) {
    const a = document.createElement('a');
    a.href = 'https://www.google.com/maps/search/?api=1&query=' + coord.lat + ',' + coord.lng;
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = 'Verifică pe hartă';
    e.appendChild(document.createTextNode(' '));
    e.appendChild(a);
  }
}

function punCoord(c) {

    : '✓ Coordonate extrase: ' + c.lat + ', ' + c.lng + '.', c.aprox ? 'warn' : 'ok', c);
}

const LINK_HINT = 'Coordonatele se completează singure din link.';

/* Golește linkul și coordonatele, ca să poți lipi alt link */
function reseteazaCoord() {

  document.getElementById('fLng').value = '';

  document.getElementById('fLink').focus();
}

/* Un link lipit îl înlocuiește pe cel vechi și se citește de fiecare dată */
function lipesteLink(ev) {
  const lipit = ((ev.clipboardData || window.clipboardData || { getData: () => '' }).getData('text') || '').trim();
  if (lipit) {
    ev.preventDefault();
    document.getElementById('fLink').value = lipit;
    dinLink(true);
  } else {
    setTimeout(() => dinLink(true), 0);
  }
}

let ultimulLink = '';
async function dinLink(fortat) {
  const text = document.getElementById('fLink').value.trim();
  const goale = !document.getElementById('fLat').value.trim() || !document.getElementById('fLng').value.trim();
  if (!text || (!fortat && !goale && text === ultimulLink)) return;
  ultimulLink = text;

  let c = coordDinText(text);
  if (c && !c.aprox) { punCoord(c); return; }
  c = ftidDinText(text) || c;

  const url = (text.match(/https?:\/\/\S+/i) || [])[0];
  if (!url) {
    if (c) punCoord(c); else linkStatus('Nu am găsit coordonate în textul lipit.', 'err');
    return;
  }
  if (!SCRIPT_URL) {
    if (c) punCoord(c); else linkStatus('Linkul nu conține coordonate. Folosește linkul lung sau completează manual.', 'err');
    return;
  }

  /* Link scurt (sau doar aproximativ): îl deschide scriptul din Google Sheet */
  if (c) punCoord(c);
  linkStatus('Se caută coordonatele în link…');
  try {
    const d = await apel({ action: 'resolve', url: url });
    if (document.getElementById('fLink').value.trim() !== text) return;
    if (Math.abs(d.lat - 37.0625) < 0.001 && Math.abs(d.lng + 95.677068) < 0.001) throw new Error('Scriptul din Google Sheet trebuie actualizat.');
    punCoord(d);
  } catch (e) {
    if (c) { punCoord(c); return; }
    ultimulLink = '';
    linkStatus(e.code === 'Actiune necunoscuta.'
      ? 'Scriptul din Google Sheet trebuie actualizat ca să citească linkurile scurte.'
      : 'Nu am putut citi linkul: ' + e.message + ' Completează coordonatele manual.', 'err');
  }
}

/* Lipire „lat, lng” într-un singur pas */
function pasteCoords(ev) {

function useMyLocation() {
  if (!navigator.geolocation) { showError('Localizarea nu este disponibilă în acest browser.'); return; }
  const btn = document.getElementById('btnLocatie');
  const gata = () => { btn.disabled = false; btn.textContent = '📍 Locația mea'; };
  const reusit = pos => {
    document.getElementById('fLat').value = pos.coords.latitude.toFixed(6);
    document.getElementById('fLng').value = pos.coords.longitude.toFixed(6);
    const m = Math.round(pos.coords.accuracy || 0);
    showError('');
    linkStatus('✓ Locația ta, cu o precizie de aproximativ ' + m + ' m.' + (m > 50 ? ' E destul de imprecisă; ieși afară sau mai încearcă o dată.' : ''),
      m > 50 ? 'warn' : 'ok', { lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6) });
    gata();
  };
  const esuat = (err, ultima) => {
    /* 1 = permisiune refuzată, 2 = poziție indisponibilă, 3 = a durat prea mult */
    if (err.code === 1) {
      showError('Telefonul nu permite acestei pagini să vadă locația. Pe iPhone: Configurări → Intimitate și securitate → Servicii de localizare → Site-uri Safari → „La utilizarea aplicației”. Apoi reîncarcă pagina și apasă „Permite”.');
      gata();
      return;
    }
    if (!ultima) {
      /* A doua încercare, mai puțin pretențioasă: merge și în interior sau cu GPS slab */
      navigator.geolocation.getCurrentPosition(reusit, e => esuat(e, true), { enableHighAccuracy: false, timeout: 20000, maximumAge: 60000 });
      return;
    }
    showError(err.code === 3
      ? 'Locația nu a putut fi stabilită la timp. Ieși afară sau lângă o fereastră și mai încearcă o dată.'
      : 'Telefonul nu își poate stabili poziția acum. Verifică dacă serviciile de localizare sunt pornite și mai încearcă o dată.');
    gata();
  };
  btn.disabled = true; btn.textContent = 'Se caută locația…';
  showError('');
  navigator.geolocation.getCurrentPosition(reusit, e => esuat(e, false), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
}

async function saveCasa(ev) {
  ev.preventDefault();
  const nume = document.getElementById('fNume').value.trim();
  const lat = parseNum(document.getElementById('fLat').value);
  const lng = parseNum(document.getElementById('fLng').value);
  const note = document.getElementById('fNote').value.trim();
  const cod = document.getElementById('fCod').value.trim();

  if (!nume) { showError('Completează numele casei.'); return; }
  if (!isFinite(lat) || lat < -90 || lat > 90) { showError('Latitudine invalidă (între -90 și 90).'); return; }
  if (!isFinite(lng) || lng < -180 || lng > 180) { showError('Longitudine invalidă (între -180 și 180).'); return; }

  const editata = inEditare;
  const date = { nume: nume, lat: lat, lng: lng, note: note, cod: cod };
  let mesaj;

  if (editata && editata.local) {
    const loc = caseLocale.find(x => x.id === editata.id);
    if (loc) Object.assign(loc, date);
    if (!saveLocale()) { showError('Modificarea nu a putut fi salvată în browser (stocare blocată).'); return; }
    mesaj = '✓ „' + nume + '” a fost modificată pe acest dispozitiv.';
  } else if (SCRIPT_URL) {
    const cheie = 'op-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
    if (editata && editata._op) {
      /* Casa are deja o modificare netrimisă: o completăm pe aceea */
      if (editata._op === opInZbor) { showError('Această casă se trimite chiar acum. Încearcă din nou în câteva secunde.'); return; }
      Object.assign(editata._op, date);
      delete editata._op.eroare;
    } else if (editata) {
      const srv = editata._srv;
      const schimbat = !acelasiNume(srv.nume, nume) || Number(srv.lat) !== lat || Number(srv.lng) !== lng || !acelasiNume(srv.note, note) || !acelasiNume(srv.cod, cod);
      if (!schimbat) { golesteFormular(); toggleForm(false); showOk('Nicio modificare de salvat.'); return; }
      coada.push(Object.assign({ k: cheie, tip: 'update', id: srv.id, numeVechi: String(srv.nume == null ? '' : srv.nume).trim() }, date));
    } else {
      coada.push(Object.assign({ k: cheie, tip: 'add' }, date));
    }
    if (!saveCoada()) {
      showError('Nu am putut păstra modificarea pe telefon (stocare blocată). Lasă formularul deschis până se trimite.');
    }
    mesaj = '„' + nume + '” e salvată pe telefon. Se trimite în Google Sheet…';
  } else {
    caseLocale.unshift(Object.assign({ id: 'local-' + Date.now(), local: true }, date));
    if (!saveLocale()) { showError('Casa nu a putut fi salvată în browser (stocare blocată).'); filterCards(); return; }
    mesaj = '✓ „' + nume + '” a fost salvată pe acest dispozitiv.';
  }

  golesteFormular();
  toggleForm(false);
  showOk(mesaj);
  filterCards();
  if (SCRIPT_URL) { actualizeazaBara(); trimiteCoada(true); }
}

async function deleteCasa(id) {
  const local = caseLocale.find(x => String(x.id) === String(id));
  if (local) {
    if (!confirm('Ștergi „' + local.nume + '”?')) return;
    caseLocale = caseLocale.filter(x => x !== local);
    saveLocale();
    filterCards();
    return;
  }
  /* O casă adăugată dar încă netrimisă: ștergerea înseamnă doar renunțare */
  if (coada.some(o => o.tip === 'add' && o.k === id)) { renuntaOp(id); return; }

  const c = case_.find(x => String(x.id) === String(id));
  const cheie = String(id);
  if (!c || inStergere.has(cheie)) return;
  const inAsteptare = coada.find(o => o.tip === 'update' && String(o.id) === cheie && acelasiNume(o.numeVechi, c.nume));
  if (inAsteptare && inAsteptare === opInZbor) { showOk('„' + c.nume + '” se trimite chiar acum. Încearcă din nou în câteva secunde.'); return; }
  if (!confirm('Ștergi „' + c.nume + '” din Google Sheet? Dispare de pe toate dispozitivele.')) return;

  const scoate = mesaj => {
    modificari++;
    case_ = case_.filter(x => String(x.id) !== cheie);
    scrieCache();
    showOk(mesaj);
  };

  if (inAsteptare) { coada = coada.filter(o => o !== inAsteptare); saveCoada(); actualizeazaBara(); }
  inStergere.add(cheie);
  modificari++;
  filterCards();
  try {
    await apel({ action: 'delete', id: c.id, nume: c.nume });
    scoate('✓ „' + c.nume + '” a fost ștearsă.');
  } catch (e) {
    /* Foaia spune că rândul nu mai există: fusese deja șters, deci îl scoatem și de aici */
    if (e.code === 'notfound' || /nu a fost gasita/i.test(e.message)) scoate('✓ „' + c.nume + '” era deja ștearsă din Google Sheet.');
    else alert('„' + c.nume + '” nu a fost ștearsă. ' + e.message);
  } finally {
    inStergere.delete(cheie);
    filterCards();
  }
}

/* Trimite tot ce trebuie pentru o casă: nume, notițe și linkul Google Maps.
   Pe telefon deschide meniul de distribuire (WhatsApp, Mesaje, e-mail…);
   pe calculator copiază textul. */
function trimiteCasa(i, btn) {
  const c = vizibile[i];
  if (!c) return;
  const text = [String(c.nume || '').trim(), c.cod ? 'Cod acces: ' + c.cod : '', String(c.note || '').trim(),
    'https://www.google.com/maps/search/?api=1&query=' + c.lat + ',' + c.lng].filter(Boolean).join('\n');
  if (navigator.share) {
    navigator.share({ text: text }).catch(() => {});
    return;
  }
  const gata = () => { btn.textContent = '✓ Copiat'; setTimeout(() => { btn.textContent = '↗ Trimite'; }, 1500); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(gata, () => prompt('Copiază textul:', text));
  } else {
    prompt('Copiază textul:', text);
  }
}

/* ================================================
   HARTĂ
   Se încarcă doar când o deschizi și are nevoie de internet.
   Arată aceleași case ca lista, deci ține cont de căutare.
   ================================================ */

let hartaActiva = false, harta = null, stratPin = null, stratEu = null, leafletP = null;

function incarcaLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletP) return leafletP;
  leafletP = new Promise((ok, err) => {
    const css = document.createElement('link');
    css.rel = 'stylesheet';
    css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
    js.onload = () => ok();
    js.onerror = () => { leafletP = null; js.remove(); css.remove(); err(new Error('fara retea')); };
    document.head.appendChild(js);
  });
  return leafletP;
}

function mesajHarta(text) {
  document.getElementById('mapMsg').textContent = text;
  document.getElementById('mapMsg').style.display = text ? 'block' : 'none';
  document.getElementById('map').style.display = text ? 'none' : 'block';
  document.getElementById('btnPozitie').style.display = text ? 'none' : '';
}

async function comutaHarta() {
  hartaActiva = !hartaActiva;
  const btn = document.getElementById('btnHarta');
  btn.textContent = hartaActiva ? 'Listă' : 'Hartă';
  btn.classList.toggle('activ', hartaActiva);
  document.getElementById('mapWrap').style.display = hartaActiva ? 'block' : 'none';
  document.getElementById('cardList').style.display = hartaActiva ? 'none' : '';
  if (!hartaActiva) return;

  mesajHarta('Se încarcă harta…');
  try { await incarcaLeaflet(); }
  catch (e) { mesajHarta('Harta are nevoie de internet. Încearcă din nou când ai semnal; lista rămâne disponibilă.'); return; }
  if (!hartaActiva) return;
  mesajHarta('');
  if (!harta) {
    harta = L.map('map', { zoomControl: true });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '&copy; OpenStreetMap'
    }).addTo(harta);
    stratPin = L.layerGroup().addTo(harta);
    stratEu = L.layerGroup().addTo(harta);
    harta.on('locationfound', ev => {
      stratEu.clearLayers();
      L.circleMarker(ev.latlng, { radius: 8, color: '#fff', weight: 2, fillColor: '#D85A30', fillOpacity: 1 }).addTo(stratEu).bindPopup('Ești aici');
    });
    harta.on('locationerror', () => { document.getElementById('btnPozitie').textContent = 'Poziție indisponibilă'; });
  }
  harta.invalidateSize();
  deseneazaPinuri(true);
}

function deseneazaPinuri(incadreaza) {
  if (!harta) return;
  stratPin.clearLayers();
  const puncte = [];
  vizibile.forEach(c => {
    const lat = Number(c.lat), lng = Number(c.lng);
    if (!coordValide(lat, lng)) return;
    puncte.push([lat, lng]);
    const html = '<div class="pop-nume">' + esc(c.nume) + '</div>' +
      (c.cod ? '<div class="pop-cod">Cod acces: <b>' + esc(c.cod) + '</b></div>' : '') +
      (c.note ? '<div class="pop-note">' + esc(c.note) + '</div>' : '') +
      '<div class="pop-links">' +
        '<a href="https://www.google.com/maps/dir/?api=1&destination=' + lat + ',' + lng + '">Google Maps</a>' +
        '<a href="https://waze.com/ul?ll=' + lat + '%2C' + lng + '&navigate=yes">Waze</a>' +
      '</div>';
    L.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 2, fillColor: '#185FA5', fillOpacity: 1 })
      .addTo(stratPin).bindPopup(html);
  });
  if (!incadreaza || !puncte.length) return;
  if (puncte.length === 1) harta.setView(puncte[0], 16);
  else harta.fitBounds(puncte, { padding: [30, 30], maxZoom: 17 });
}

function pozitiaMea() {
  if (!harta) return;
  document.getElementById('btnPozitie').textContent = '📍 Poziția mea';
  harta.locate({ setView: true, maxZoom: 15, enableHighAccuracy: true });
}

/* Apăsarea pe codul de acces îl copiază */
function copyCod(el, i) {
  const c = vizibile[i];
  if (!c || !c.cod) return;
  const cod = String(c.cod);
  const val = el.querySelector('.val');
  const gata = () => {
    val.textContent = '✓ Cod copiat';
    el.classList.add('copiat');
    setTimeout(() => { val.textContent = cod; el.classList.remove('copiat'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cod).then(gata, () => prompt('Copiază codul:', cod));
  } else {
    prompt('Copiază codul:', cod);
  }
}

/* Apăsarea pe coordonate le copiază ca text: „lat, lng” */
function copyCoords(el, lat, lng) {
  const text = lat + ', ' + lng;
  const gata = () => {
    el.textContent = '✓ Coordonate copiate';
    el.classList.add('copiat');
    setTimeout(() => { el.textContent = '' + text; el.classList.remove('copiat'); }, 1500);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(gata, () => prompt('Copiază coordonatele:', text));
  } else {
    prompt('Copiază coordonatele:', text);
  }
}

/* Eticheta arată ultima operațiune asupra casei:
   Modificat = editată din aplicație · Manual = adăugată din aplicație · Direct = scrisă în Google Sheet */
function eticheta(c) {
  if (c.local) return ['badge-local', 'Doar pe acest dispozitiv'];
  if (c._op && c._op.eroare) return ['badge-eroare', 'Netrimis'];
  if (c._op) return ['badge-asteptare', c._op === opInZbor ? 'Se trimite…' : 'În așteptare'];
  if (c.modificat) return ['badge-modificat', 'Modificat'];
  if (c.app) return ['badge-manual', 'Manual'];
  return ['badge-direct', 'Direct'];
}

function render(list) {
  const el = document.getElementById('cardList');
  const n = list.length;
  document.getElementById('subtitle').textContent = toateCasele().length + ' locații';
  document.getElementById('countLabel').textContent = 'Se afișează ' + n + ' locați' + (n === 1 ? 'e' : 'i');

  vizibile = list;
  if (hartaActiva) deseneazaPinuri(true);

  if (n === 0) {
    el.innerHTML = pinCerut && !toateCasele().length
      ? '<div class="no-results">Lista este protejată cu un cod PIN.<br><br><button class="btn-harta" onclick="incarca()">Introdu codul PIN</button></div>'
      : '<div class="no-results">' + (seIncarca && !toateCasele().length ? 'Se încarcă lista…' : 'Nicio locație găsită.') + '</div>';
    return;
  }

  el.innerHTML = list.map((c, i) => {
    const [badgeClass, badgeText] = eticheta(c);
    const gmUrl  = 'https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng;
    const wazeUrl = 'https://waze.com/ul?ll=' + c.lat + '%2C' + c.lng + '&navigate=yes';
    const telHtml = c.tel ? '<a href="tel:' + c.tel + '" class="btn-nav btn-copy" style="flex:none;padding:9px 12px;">📞 ' + c.tel + '</a>' : '';

    const seSterge = inStergere.has(String(c.id));
    return '<div class="card' + (seSterge ? ' stergere' : '') + '">' +
      '<div class="card-top">' +
        '<span class="card-name">' + esc(c.nume) + '</span>' +
        '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>' +
      (c.adresa ? '<div class="card-addr">' + c.adresa + '</div>' : '') +
      (c.suprafata || c.pret ? '<div class="card-meta">' +
        (c.suprafata ? '<span>Suprafață: <strong>' + c.suprafata + '</strong></span>' : '') +
        (c.pret ? '<span>Preț: <strong>' + c.pret + '</strong></span>' : '') +
      '</div>' : '') +
      (c.cod ? '<div class="card-cod" role="button" title="Apasă pentru a copia codul" onclick="copyCod(this,' + i + ')"><span class="et">Cod acces</span><span class="val">' + esc(c.cod) + '</span></div>' : '') +
      (c.note ? '<div class="card-note" style="white-space:pre-wrap">' + esc(c.note) + '</div>' : '') +
      (c._op && c._op.eroare ? '<div class="card-err">Nu a putut fi trimisă: ' + esc(c._op.eroare) + ' Editează și salvează din nou, sau renunță.</div>' : '') +
      '<div class="card-actions">' +
        '<a class="btn-nav btn-gm" href="' + gmUrl + '">Google Maps</a>' +
        '<a class="btn-nav btn-waze" href="' + wazeUrl + '">Waze</a>' +
        '<button class="btn-nav btn-copy" onclick="copyLink(this,' + c.lat + ',' + c.lng + ')">Copiază link</button>' +
      '</div>' +
      (c.tel ? '<div class="card-actions">' + telHtml + '</div>' : '') +
      (c.local || SCRIPT_URL ? '<div class="card-edit">' +
        '<button class="btn-nav btn-copy btn-edit" onclick="editCasa(' + i + ')">✎ Editează</button>' +
        '<button class="btn-nav btn-copy btn-edit" onclick="trimiteCasa(' + i + ', this)">↗ Trimite</button>' +
        (c._op && c._op.tip === 'update' ? '<button class="btn-nav btn-copy btn-edit" onclick="renuntaOp(\'' + esc(c._op.k) + '\')">Renunță</button>' : '') +
        (c.local || c.app ? '<button class="btn-nav btn-del" onclick="deleteCasa(\'' + esc(c.id) + '\')">' + (seSterge ? 'Se șterge…' : 'Șterge') + '</button>' : '') +
      '</div>' : '') +
      '<div><span class="coords" role="button" title="Apasă pentru a copia coordonatele" onclick="copyCoords(this,' + c.lat + ',' + c.lng + ')">' + c.lat + ', ' + c.lng + '</span></div>' +
    '</div>';
  }).join('');
}

filterCards();
actualizeazaBara();
incarca();

/* Reîncarcă pagina cu ultima versiune de pe server și cu lista la zi.
   Copia păstrată pe telefon se înlocuiește doar dacă versiunea nouă chiar
   s-a descărcat; fără semnal rămâne cea veche, ca pagina să se deschidă în continuare. */
async function reincarcaPagina() {
  const btn = document.getElementById('btnReload');
  btn.disabled = true; btn.textContent = 'Se reîncarcă…';
  let vechi = [], cache = null;
  try {
    if ('caches' in window) {
      cache = await caches.open('portofoliu-case-v1');
      for (const req of await cache.keys()) vechi.push([req, await cache.match(req)]);
      for (const [req] of vechi) await cache.delete(req);
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 20000);
    let res;
    try { res = await fetch(location.pathname, { cache: 'reload', signal: ctrl.signal }); }
    finally { clearTimeout(timer); }
    if (!res.ok) throw new Error('raspuns ' + res.status);
    await res.text();
    location.reload();
  } catch (e) {
    if (cache) { for (const [req, resp] of vechi) { try { await cache.put(req, resp); } catch (err) {} } }
    btn.disabled = false; btn.textContent = '↻ Reîncarcă';
    setSync('fără conexiune, pagina nu a putut fi reîncărcată');
  }
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
