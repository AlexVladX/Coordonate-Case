<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portofoliu Case</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; color: #1a1a18; min-height: 100vh; }
  .header { padding: 16px; border-bottom: 1px solid #e5e3da; background: #fff; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 10; }
  .header-icon { width: 36px; height: 36px; background: #E6F1FB; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .header h1 { font-size: 17px; font-weight: 600; }
  .header span { font-size: 13px; color: #73726c; }
  .search-bar { padding: 10px 16px; background: #fff; border-bottom: 1px solid #e5e3da; }
  .search-bar input { width: 100%; padding: 9px 14px; border: 1px solid #d3d1c7; border-radius: 10px; font-size: 15px; background: #f5f5f0; color: #1a1a18; outline: none; }
  .search-bar input:focus { border-color: #378ADD; background: #fff; }
  .filters { padding: 10px 16px; display: flex; gap: 8px; background: #fff; border-bottom: 1px solid #e5e3da; overflow-x: auto; }
  .filter-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #d3d1c7; font-size: 13px; cursor: pointer; white-space: nowrap; background: #fff; color: #5f5e5a; }
  .filter-btn.active { background: #E6F1FB; color: #0C447C; border-color: #85B7EB; font-weight: 500; }
  .count { font-size: 13px; color: #73726c; padding: 10px 16px 4px; }
  .list { padding: 8px 16px 24px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: #fff; border: 1px solid #e5e3da; border-radius: 14px; padding: 14px; }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 8px; }
  .card-name { font-size: 16px; font-weight: 600; line-height: 1.3; }
  .badge { font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
  .badge-new { background: #E6F1FB; color: #0C447C; }
  .badge-visited { background: #EAF3DE; color: #27500A; }
  .badge-contact { background: #FAEEDA; color: #633806; }
  .card-addr { font-size: 13px; color: #73726c; margin-bottom: 8px; line-height: 1.4; }
  .card-meta { display: flex; gap: 16px; font-size: 13px; color: #73726c; margin-bottom: 8px; flex-wrap: wrap; }
  .card-meta strong { color: #1a1a18; }
  .card-note { font-size: 13px; color: #5f5e5a; background: #f5f5f0; border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; line-height: 1.5; }
  .card-actions { display: flex; gap: 8px; margin-bottom: 8px; }
  .btn-nav { flex: 1; padding: 9px 8px; border-radius: 10px; border: 1px solid #d3d1c7; font-size: 14px; font-weight: 500; cursor: pointer; background: #f5f5f0; color: #1a1a18; text-decoration: none; text-align: center; display: block; }
  .btn-gm { background: #E6F1FB; color: #0C447C; border-color: #85B7EB; }
  .btn-waze { background: #EAF3DE; color: #1E5C0E; border-color: #97C459; }
  .btn-copy { background: #f5f5f0; color: #5f5e5a; border-color: #d3d1c7; font-size: 13px; }
  .coords { font-size: 11px; color: #b4b2a9; }
  .no-results { text-align: center; padding: 40px 20px; color: #73726c; }
  .add-panel { background: #fff; border-bottom: 1px solid #e5e3da; padding: 10px 16px; }
  .add-toggle { width: 100%; padding: 10px; border-radius: 10px; border: 1px dashed #85B7EB; background: #E6F1FB; color: #0C447C; font-size: 15px; font-weight: 600; cursor: pointer; }
  .add-form { display: none; flex-direction: column; gap: 10px; margin-top: 12px; }
  .add-form.open { display: flex; }
  .add-form label { font-size: 12px; font-weight: 600; color: #5f5e5a; display: block; margin-bottom: 4px; }
  .add-form input, .add-form textarea { width: 100%; padding: 9px 12px; border: 1px solid #d3d1c7; border-radius: 10px; font-size: 16px; font-family: inherit; background: #f5f5f0; color: #1a1a18; outline: none; }
  .add-form input:focus, .add-form textarea:focus { border-color: #378ADD; background: #fff; }
  .add-form textarea { min-height: 70px; resize: vertical; }
  .coord-row { display: flex; gap: 8px; }
  .coord-row > div { flex: 1; min-width: 0; }
  .form-hint { font-size: 12px; color: #73726c; }
  .link-status { font-size: 12px; margin-top: 4px; min-height: 16px; color: #73726c; }
  .link-status.ok { color: #27500A; }
  .link-status.err { color: #A32D2D; }
  .card.stergere { opacity: .45; pointer-events: none; }
  .form-error { font-size: 13px; color: #A32D2D; display: none; }
  .form-actions { display: flex; gap: 8px; }
  .btn-save { background: #185FA5; color: #fff; border-color: #185FA5; }
  .btn-del { flex: none; background: #FCEBEB; color: #A32D2D; border-color: #F09595; font-size: 13px; }
  .form-ok { font-size: 13px; color: #27500A; background: #EAF3DE; border-radius: 8px; padding: 8px 10px; margin-top: 10px; display: none; }
  .btn-save:disabled { opacity: .6; cursor: default; }
  .badge-app { background: #E1F5EE; color: #085041; }
  .badge-local { background: #EEEDFE; color: #3C3489; }
</style>
</head>
<body>

<div class="header">
  <div class="header-icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5S10.62 6.5 12 6.5s2.5 1.12 2.5 2.5S13.38 11.5 12 11.5z" fill="#185FA5"/>
    </svg>
  </div>
  <div>
    <h1>Portofoliu Case</h1>
    <span id="subtitle"></span>
  </div>
</div>

<div class="search-bar">
  <input type="text" placeholder="Caută după nume sau adresă..." id="searchInput" oninput="filterCards()">
</div>

<div class="add-panel">
  <button class="add-toggle" id="addToggle" onclick="toggleForm()">+ Adaugă casă</button>
  <form class="add-form" id="addForm" onsubmit="saveCasa(event)">
    <div>
      <label for="fNume">Nume casă</label>
      <input type="text" id="fNume" placeholder="ex. Vila Marina" required>
    </div>
    <div>
      <label for="fLink">Link Google Maps / Hărți Apple (opțional)</label>
      <input type="text" id="fLink" placeholder="Lipește linkul locației" autocomplete="off" autocapitalize="off"
             onpaste="setTimeout(dinLink, 0)" onchange="dinLink()">
      <div class="link-status" id="linkStatus">Coordonatele se completează singure din link.</div>
    </div>
    <div class="coord-row">
      <div>
        <label for="fLat">Latitudine</label>
        <input type="text" id="fLat" inputmode="decimal" placeholder="42.5531" onpaste="pasteCoords(event)" required>
      </div>
      <div>
        <label for="fLng">Longitudine</label>
        <input type="text" id="fLng" inputmode="decimal" placeholder="8.7572" required>
      </div>
    </div>
    <div>
      <label for="fNote">Notițe</label>
      <textarea id="fNote" placeholder="Cod poartă, parcare, observații..."></textarea>
    </div>
    <div class="form-hint" id="modeHint"></div>
    <div class="form-error" id="formError"></div>
    <div class="form-actions">
      <button type="button" class="btn-nav btn-copy" onclick="useMyLocation()">📍 Locația mea</button>
      <button type="submit" class="btn-nav btn-save" id="btnSave">Salvează</button>
    </div>
  </form>
  <div class="form-ok" id="formOk"></div>
</div>

<div class="count"><span id="countLabel"></span><span id="syncLabel"></span></div>
<div class="list" id="cardList"></div>

<script>
/* ================================================
   EDITEAZĂ LISTA DE CASE MAI JOS
   ================================================
   Pentru fiecare casă, completează:
   - nume: numele sau ID-ul proprietății
   - adresa: adresa completă
   - lat / lng: coordonatele GPS (zecimale)
   - note: observații personale
   - status: "new" | "visited" | "contact"
   - suprafata: ex. "120mp"
   - pret: ex. "95.000€" (opțional, lasă "" dacă nu vrei)
   - tel: telefon proprietar (opțional, lasă "" dacă nu vrei)
   ================================================ */

let case_ = [];

/* ================================================
   LEGĂTURA CU GOOGLE SHEET
   Lipește între ghilimele adresa aplicației web Apps Script
   (se termină în /exec). Cât timp rămâne goală, casele noi
   se salvează doar pe dispozitivul curent.
   ================================================ */
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbylIOmKEu8GqeKfwAYU073vx1Z3AU5qw0GgzLB52vI3x33mtm0m1f5CigSyYO21DCdiYA/exec';

const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTK9Gqn_GzSAwiiml_UeBj6bugILzKLImxmxN5hORWfJ3jsQFxaqkknue_CDu158ywXbvqxKwiB3JO4/pub?output=csv';

/* Copia listei păstrată pe telefon: se afișează imediat la deschidere,
   apoi se actualizează în fundal când răspunde rețeaua. */
const CACHE_KEY = 'coordonate-case-cache';
let cacheData = null;      // momentul ultimei actualizări reușite
let seIncarca = true;
let modificari = 0;        // crește la fiecare adăugare / ștergere
const inStergere = new Set();

function citesteCache() {
  try {
    const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null');
    if (c && Array.isArray(c.case)) { case_ = c.case; cacheData = c.t; return true; }
  } catch (e) {}
  return false;
}

function scrieCache() {
  cacheData = Date.now();
  try { localStorage.setItem(CACHE_KEY, JSON.stringify({ t: cacheData, case: case_ })); } catch (e) {}
}

function setSync(text) { document.getElementById('syncLabel').textContent = text ? ' · ' + text : ''; }

function dataScurta(t) {
  const d = new Date(t), azi = new Date();
  const ora = d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit' });
  return d.toDateString() === azi.toDateString() ? 'azi ' + ora : d.toLocaleDateString('ro-RO', { day: 'numeric', month: 'short' }) + ' ' + ora;
}

function cuLimita(url) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 25000);
  return fetch(url, { signal: ctrl.signal }).finally(() => clearTimeout(timer));
}

async function dinCsv() {
  const text = await (await cuLimita(CSV_URL)).text();
  return text.split('\n').slice(1).filter(r => r.trim() !== '').map(r => {
    const [id, nume, lat, lng, note] = r.split(',');
    return { id: Number(id), nume: nume, lat: Number(lat), lng: Number(lng), note: note };
  });
}

async function dinScript() {
  const d = await (await cuLimita(SCRIPT_URL)).json();
  if (!d.ok) throw new Error(d.error);
  return d.case;
}

async function incarca() {
  const areCache = citesteCache();
  if (areCache) filterCards();
  setSync('se actualizează…');
  const v = modificari;
  try {
    let lista;
    if (SCRIPT_URL) {
      try { lista = await dinScript(); }
      catch (e) { if (areCache) throw e; lista = await dinCsv(); }
    } else {
      lista = await dinCsv();
    }
    /* Dacă între timp s-a adăugat sau șters ceva, răspunsul acesta e deja vechi:
       nu-l folosim, ca să nu readucă în listă o casă ștearsă. */
    if (v !== modificari) { setSync(''); seIncarca = false; return; }
    case_ = lista;
    scrieCache();
    setSync('actualizat acum');
  } catch (e) {
    setSync(cacheData ? 'fără conexiune, date de ' + dataScurta(cacheData) : 'fără conexiune');
  }
  seIncarca = false;
  filterCards();
}

/* ================================================ */

/* ================================================
   CASE ADĂUGATE DIN FORMULAR
   Se salvează în browser (localStorage), pe acest dispozitiv.
   ================================================ */

const STORAGE_KEY = 'coordonate-case-local';
let caseLocale = loadLocale();

function loadLocale() {
  try {
    const v = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    return Array.isArray(v) ? v : [];
  } catch (e) { return []; }
}

function saveLocale() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(caseLocale)); return true; }
  catch (e) { return false; }
}

function toateCasele() { return caseLocale.concat(case_); }

function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, ch =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}

function parseNum(v) { return Number(String(v).trim().replace(',', '.')); }

function showOk(msg) {
  const e = document.getElementById('formOk');
  e.textContent = msg;
  e.style.display = msg ? 'block' : 'none';
}

const PIN_KEY = 'coordonate-case-pin';
function getPin() { try { return localStorage.getItem(PIN_KEY) || ''; } catch (e) { return ''; } }
function setPin(v) { try { localStorage.setItem(PIN_KEY, v); } catch (e) {} }

/* Trimite o modificare către Google Sheet */
async function apel(data, pinGresit) {
  data.pin = getPin();
  let d;
  try {
    const res = await fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    });
    d = await res.json();
  } catch (e) {
    throw new Error('Nu am putut contacta Google Sheet. Verifică conexiunea la internet.');
  }
  if (d.error === 'pin') {
    const p = prompt(pinGresit ? 'Cod greșit. Încearcă din nou:' : 'Introdu codul PIN pentru modificări:');
    if (p === null) throw new Error('Operațiune anulată.');
    setPin(p.trim());
    return apel(data, true);
  }
  if (!d.ok) {
    const er = new Error(d.mesaj || d.error || 'Eroare necunoscută.');
    er.code = d.error;
    throw er;
  }
  return d;
}

/* ================================================
   COORDONATE DIN LINK (Google Maps / Hărți Apple)
   ================================================ */

function coordValide(lat, lng) {
  lat = Number(lat); lng = Number(lng);
  return isFinite(lat) && isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180 && !(lat === 0 && lng === 0);
}

/* Întoarce { lat, lng, aprox } sau null */
function coordDinText(text) {
  let t = String(text || '');
  for (let i = 0; i < 2; i++) { try { t = decodeURIComponent(t); } catch (e) { break; } }
  const N = '(-?\\d{1,3}(?:\\.\\d+)?)';
  const tipare = [
    [new RegExp('!3d' + N + '!4d' + N), false],                                             // Google: pinul locului
    [new RegExp('[?&#](?:q|query|ll|coordinate|destination|daddr|center|address)=(?:loc:)?' + N + '\\s*,\\s*' + N, 'i'), false],
    [new RegExp('/maps/(?:search|place|dir)/' + N + ',\\+?' + N), false],
    [new RegExp('@' + N + ',' + N), true],                                                  // Google: centrul hărții
    [new RegExp('[?&#]sll=' + N + ',' + N, 'i'), true]
  ];
  for (const [re, aprox] of tipare) {
    const m = t.match(re);
    if (m && coordValide(m[1], m[2])) return { lat: Number(m[1]), lng: Number(m[2]), aprox: aprox };
  }
  if (!/https?:\/\//i.test(t)) {
    const m = t.match(new RegExp(N + '\\s*[,;\\s]\\s*' + N));
    if (m && coordValide(m[1], m[2])) return { lat: Number(m[1]), lng: Number(m[2]), aprox: false };
  }
  return null;
}

function linkStatus(msg, tip) {
  const e = document.getElementById('linkStatus');
  e.textContent = msg;
  e.className = 'link-status' + (tip ? ' ' + tip : '');
}

function punCoord(c) {
  document.getElementById('fLat').value = c.lat;
  document.getElementById('fLng').value = c.lng;
  linkStatus(c.aprox
    ? '✓ Coordonate extrase, dar aproximative (centrul hărții). Verifică-le.'
    : '✓ Coordonate extrase: ' + c.lat + ', ' + c.lng, 'ok');
}

let ultimulLink = '';
async function dinLink() {
  const text = document.getElementById('fLink').value.trim();
  if (!text || text === ultimulLink) return;
  ultimulLink = text;

  const c = coordDinText(text);
  if (c && !c.aprox) { punCoord(c); return; }

  const url = (text.match(/https?:\/\/\S+/i) || [])[0];
  if (!url) {
    if (c) punCoord(c); else linkStatus('Nu am găsit coordonate în textul lipit.', 'err');
    return;
  }
  if (!SCRIPT_URL) {
    if (c) punCoord(c); else linkStatus('Linkul nu conține coordonate. Folosește linkul lung sau completează manual.', 'err');
    return;
  }

  /* Link scurt (sau doar aproximativ): îl deschide scriptul din Google Sheet */
  if (c) punCoord(c);
  linkStatus('Se caută coordonatele în link…');
  try {
    const d = await apel({ action: 'resolve', url: url });
    if (document.getElementById('fLink').value.trim() !== text) return;
    punCoord(d);
  } catch (e) {
    if (c) { punCoord(c); return; }
    ultimulLink = '';
    linkStatus(e.code === 'Actiune necunoscuta.'
      ? 'Scriptul din Google Sheet trebuie actualizat ca să citească linkurile scurte.'
      : 'Nu am putut citi linkul: ' + e.message + ' Completează coordonatele manual.', 'err');
  }
}

function toggleForm(open) {
  const f = document.getElementById('addForm');
  const isOpen = open === undefined ? !f.classList.contains('open') : open;
  f.classList.toggle('open', isOpen);
  document.getElementById('addToggle').textContent = isOpen ? '× Închide' : '+ Adaugă casă';
  if (isOpen) { showOk(''); document.getElementById('fNume').focus(); }
}

function showError(msg) {
  const e = document.getElementById('formError');
  e.textContent = msg;
  e.style.display = msg ? 'block' : 'none';
}

/* Lipire „lat, lng” într-un singur pas */
function pasteCoords(ev) {
  const text = (ev.clipboardData || window.clipboardData).getData('text');
  const m = text.match(/(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) return;
  ev.preventDefault();
  document.getElementById('fLat').value = m[1];
  document.getElementById('fLng').value = m[2];
}

function useMyLocation() {
  if (!navigator.geolocation) { showError('Localizarea nu este disponibilă pe acest dispozitiv.'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    document.getElementById('fLat').value = pos.coords.latitude.toFixed(6);
    document.getElementById('fLng').value = pos.coords.longitude.toFixed(6);
    showError('');
  }, () => showError('Nu am putut obține locația. Verifică permisiunile.'), { enableHighAccuracy: true, timeout: 10000 });
}

async function saveCasa(ev) {
  ev.preventDefault();
  const nume = document.getElementById('fNume').value.trim();
  const lat = parseNum(document.getElementById('fLat').value);
  const lng = parseNum(document.getElementById('fLng').value);
  const note = document.getElementById('fNote').value.trim();

  if (!nume) { showError('Completează numele casei.'); return; }
  if (!isFinite(lat) || lat < -90 || lat > 90) { showError('Latitudine invalidă (între -90 și 90).'); return; }
  if (!isFinite(lng) || lng < -180 || lng > 180) { showError('Longitudine invalidă (între -180 și 180).'); return; }

  let mesaj;
  if (SCRIPT_URL) {
    const btn = document.getElementById('btnSave');
    btn.disabled = true; btn.textContent = 'Se salvează...';
    modificari++;
    try {
      const d = await apel({ action: 'add', nume: nume, lat: lat, lng: lng, note: note });
      modificari++;
      case_.push(d.casa);
      scrieCache();
      mesaj = '✓ „' + nume + '” a fost salvată în Google Sheet.';
    } catch (e) {
      showError(e.message);
      return;
    } finally {
      btn.disabled = false; btn.textContent = 'Salvează';
    }
  } else {
    caseLocale.unshift({ id: 'local-' + Date.now(), nume: nume, lat: lat, lng: lng, note: note, local: true });
    if (!saveLocale()) { showError('Casa nu a putut fi salvată în browser (stocare blocată).'); filterCards(); return; }
    mesaj = '✓ „' + nume + '” a fost salvată pe acest dispozitiv.';
  }

  showError('');
  document.getElementById('addForm').reset();
  ultimulLink = '';
  linkStatus('Coordonatele se completează singure din link.');
  toggleForm(false);
  showOk(mesaj);
  filterCards();
}

async function deleteCasa(id) {
  const local = caseLocale.find(x => String(x.id) === String(id));
  if (local) {
    if (!confirm('Ștergi „' + local.nume + '”?')) return;
    caseLocale = caseLocale.filter(x => x !== local);
    saveLocale();
    filterCards();
    return;
  }
  const c = case_.find(x => String(x.id) === String(id));
  const cheie = String(id);
  if (!c || inStergere.has(cheie)) return;
  if (!confirm('Ștergi „' + c.nume + '” din Google Sheet? Dispare de pe toate dispozitivele.')) return;

  const scoate = mesaj => {
    modificari++;
    case_ = case_.filter(x => String(x.id) !== cheie);
    scrieCache();
    showOk(mesaj);
  };

  inStergere.add(cheie);
  modificari++;
  filterCards();
  try {
    await apel({ action: 'delete', id: c.id, nume: c.nume });
    scoate('✓ „' + c.nume + '” a fost ștearsă.');
  } catch (e) {
    /* Foaia spune că rândul nu mai există: fusese deja șters, deci îl scoatem și de aici */
    if (e.code === 'notfound' || /nu a fost gasita/i.test(e.message)) scoate('✓ „' + c.nume + '” era deja ștearsă din Google Sheet.');
    else alert('„' + c.nume + '” nu a fost ștearsă. ' + e.message);
  } finally {
    inStergere.delete(cheie);
    filterCards();
  }
}

document.getElementById('modeHint').textContent = SCRIPT_URL
  ? 'Casa se salvează în Google Sheet și apare pe toate dispozitivele.'
  : 'Neconectat la Google Sheet: casa se salvează doar pe acest dispozitiv.';

/* ================================================ */

let activeFilter = 'all';

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterCards();
}

function filterCards() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const visible = toateCasele().filter(c => {
    return (c.nume || '').toLowerCase().includes(q) ||
           (c.note || '').toLowerCase().includes(q);
  });
  render(visible);
}

function statusLabel(s) {
  if (s === 'visited') return ['badge-visited', 'Vizitat'];
  if (s === 'contact') return ['badge-contact', 'De contactat'];
  return ['badge-new', 'Nevizitat'];
}

function copyCoords(lat, lng) {
  const text = lat + ', ' + lng;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => alert('Coordonate copiate: ' + text));
  } else {
    prompt('Copiază coordonatele:', text);
  }
}

function render(list) {
  const el = document.getElementById('cardList');
  const n = list.length;
  document.getElementById('subtitle').textContent = toateCasele().length + ' locații';
  document.getElementById('countLabel').textContent = 'Se afișează ' + n + ' locați' + (n === 1 ? 'e' : 'i');

  if (n === 0) {
    el.innerHTML = '<div class="no-results">' + (seIncarca && !toateCasele().length ? 'Se încarcă lista…' : 'Nicio locație găsită.') + '</div>';
    return;
  }

  el.innerHTML = list.map(c => {
    const [badgeClass, badgeText] = c.local ? ['badge-local', 'Doar pe acest dispozitiv'] : c.app ? ['badge-app', 'Adăugată din aplicație'] : statusLabel(c.status || 'new');
    const gmUrl  = 'https://www.google.com/maps/dir/?api=1&destination=' + c.lat + ',' + c.lng;
    const wazeUrl = 'https://waze.com/ul?ll=' + c.lat + '%2C' + c.lng + '&navigate=yes';
    const telHtml = c.tel ? '<a href="tel:' + c.tel + '" class="btn-nav btn-copy" style="flex:none;padding:9px 12px;">📞 ' + c.tel + '</a>' : '';

    const seSterge = inStergere.has(String(c.id));
    return '<div class="card' + (seSterge ? ' stergere' : '') + '">' +
      '<div class="card-top">' +
        '<span class="card-name">' + esc(c.nume) + '</span>' +
        '<span class="badge ' + badgeClass + '">' + badgeText + '</span>' +
      '</div>' +
      (c.adresa ? '<div class="card-addr">' + c.adresa + '</div>' : '') +
      (c.suprafata || c.pret ? '<div class="card-meta">' +
        (c.suprafata ? '<span>Suprafață: <strong>' + c.suprafata + '</strong></span>' : '') +
        (c.pret ? '<span>Preț: <strong>' + c.pret + '</strong></span>' : '') +
      '</div>' : '') +
      (c.note ? '<div class="card-note" style="white-space:pre-wrap">' + esc(c.note) + '</div>' : '') +
      '<div class="card-actions">' +
        '<a class="btn-nav btn-gm" href="' + gmUrl + '">Google Maps</a>' +
        '<a class="btn-nav btn-waze" href="' + wazeUrl + '">Waze</a>' +
        '<button class="btn-nav btn-copy" onclick="copyCoords(' + c.lat + ',' + c.lng + ')">Copiază GPS</button>' +
        (c.local || c.app ? '<button class="btn-nav btn-del" onclick="deleteCasa(\'' + esc(c.id) + '\')">' + (seSterge ? 'Se șterge…' : 'Șterge') + '</button>' : '') +
      '</div>' +
      (c.tel ? '<div class="card-actions">' + telHtml + '</div>' : '') +
      '<div class="coords">' + c.lat + ', ' + c.lng + '</div>' +
    '</div>';
  }).join('');
}

filterCards();
incarca();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
